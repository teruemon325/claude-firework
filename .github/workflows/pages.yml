# demo/ を GitHub Pages に公開するワークフロー
#
# 初回のみ、リポジトリの Settings → Pages → Build and deployment →
# Source を「GitHub Actions」に変更してください。
#
# 公開先: https://teruemon325.github.io/claude-firework/
name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - "claude/morioka-fireworks-3d-feasibility-rbsghh"
      - main
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jekyll の処理を無効化（そのまま静的配信する）
      - name: Disable Jekyll
        run: touch demo/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # demo/ をサイトのルートとして公開する
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
